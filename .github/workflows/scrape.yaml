name: Auto Update Data

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  workflow_dispatch:      # Allows manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      checks: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      # Reads the supported terms from js/terms.js, moves the window forward when
      # bannerweb has added a newer term, scrapes every term in it and stores the
      # data of the ones that changed under the next version number. Rewrites
      # js/terms.js and sets the changes/version/summary outputs when anything changed.
      - name: Update the course data of the supported terms
        id: check
        run: python scraper/update.py

      - name: Create Pull Request
        id: cpr
        if: steps.check.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          commit-message: "chore: update data to v${{ steps.check.outputs.version }}"
          title: "Data Update to v${{ steps.check.outputs.version }}"
          body: |
            Automated data update

            - ${{ steps.check.outputs.summary }}
            - Last updated: ${{ github.event.repository.updated_at }}

            This PR was automatically generated by GitHub Actions.
          branch: auto-update-data
          base: master
          delete-branch: true

      - name: Merge Pull Request
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.cpr.outputs.pull-request-number }}"
          # GitHub can take a few seconds to compute a fresh PR's mergeable
          # state, so a merge right after creation can transiently fail.
          for attempt in 1 2 3 4 5; do
            if gh pr merge "$PR_NUMBER" --squash --delete-branch; then
              exit 0
            fi
            echo "Merge attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          echo "::error::Failed to merge PR #$PR_NUMBER after 5 attempts."
          exit 1
